{% extends 'exam/adminbase.html' %}
{% block content %}
<div class="container">
  <h2 class="text-center">Seating Allocation</h2>
  <hr>
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <h4>Select Course for Seating Allocation</h4>
          <div class="row">
            {% for course in courses %}
            <div class="col-md-4 mt-3">
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">{{course.course_name}}</h5>
                  <p>Total Questions: {{course.question_number}}</p>
                  <p>Total Marks: {{course.total_marks}}</p>
                  <a href="{% url 'allocate-seats' course.id %}" class="btn btn-primary">Allocate Seats</a>
                </div>
              </div>
            </div>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
